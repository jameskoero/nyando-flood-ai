name: CI — Nyando Flood AI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn imbalanced-learn \
                      pandas numpy matplotlib joblib \
                      pytest

      - name: Check training data
        run: |
          python - << 'EOF'
          import pandas as pd, sys
          df = pd.read_csv('data/training/nyando_training_v1.csv')
          assert len(df) >= 100, f'Too few rows: {len(df)}'
          assert 'flooded' in df.columns, 'Missing target column'
          assert df['flooded'].isin([0, 1]).all(), 'Target not binary'
          assert df.isnull().sum().sum() == 0, 'Nulls found in data'
          print(f'Data OK: {df.shape}  flood_rate={df["flooded"].mean():.1%}')
          EOF

      - name: Check metrics.json
        run: |
          python - << 'EOF'
          import json, sys
          m = json.load(open('metrics.json'))
          auc = m.get('auc_roc', m.get('auc', 0))
          f1  = m.get('f1_score', m.get('f1', 0))
          assert auc >= 0.85, f'AUC too low: {auc}'
          assert f1  >= 0.75, f'F1 too low:  {f1}'
          print(f'Metrics OK: AUC={auc}  F1={f1}')
          EOF

      - name: Check model loads and predicts
        run: |
          python - << 'EOF'
          import joblib, numpy as np
          model = joblib.load('models/nyando_xgb_v1.pkl')
          sample = np.array([[1200.0, 3.0, 60.0, 500.0, 35.0, 40]])
          prob = float(model.predict_proba(sample)[0, 1])
          assert 0.0 <= prob <= 1.0, f'Invalid probability: {prob}'
          print(f'Model OK: risk_score={prob:.4f}')
          EOF

      - name: Run pytest suite
        run: pytest tests/ -v --tb=short
