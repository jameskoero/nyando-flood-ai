name: AI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check model and data files
        run: |
          ls models/*.pkl 2>/dev/null || echo "No model files found"
          ls data/training/*.csv 2>/dev/null || echo "No CSV files found"

      - name: Run tests
        run: pytest tests/ -v --tb=short
