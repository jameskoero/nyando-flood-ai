name: Image
# Row D32: builds the production image the way Render does, so a lock file pip cannot verify, a wheel that does not exist for Linux,
# or a registered model that does not load stops here and not at deploy.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements-image.in
      - requirements-image.lock
      - constraints-ci.txt
      - backend/**
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements-image.in
      - requirements-image.lock
      - constraints-ci.txt
      - backend/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --tag nyando-image .
