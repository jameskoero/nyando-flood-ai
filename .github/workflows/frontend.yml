name: frontend

# Lints and builds the dashboard on every pull request and push to main, and measures it with Lighthouse (mobile), keeping the report as an artifact. Read-only; every action is pinned by commit SHA.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Serve the build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
      - name: Lighthouse (mobile)
        run: |
          mkdir -p lh
          npx --yes lighthouse@13.5.0 http://127.0.0.1:4173/ --quiet --form-factor=mobile --chrome-flags="--headless=new --no-sandbox" --output=json --output=html --output-path=lh/report
          for i in 2 3 4 5; do
            npx --yes lighthouse@13.5.0 http://127.0.0.1:4173/ --quiet --form-factor=mobile --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh/r$i.report.json
          done
      - name: Scores
        run: |
          node -e "const files=['./lh/report.report.json','./lh/r2.report.json','./lh/r3.report.json','./lh/r4.report.json','./lh/r5.report.json']; const runs=files.map((f)=>{const r=require(f); const o={}; for (const [k,v] of Object.entries(r.categories)) o[k]=Math.round(v.score*100); return o;}); const med=(a)=>{const b=[...a].sort((x,y)=>x-y); return b[(b.length-1)>>1];}; const s={}; for (const k of ['performance','accessibility','best-practices','seo']) { const v=runs.map((o)=>o[k]); s[k]=(k==='performance')?Math.max(...v):Math.min(...v); if (k==='performance') console.log('performance median '+med(v)+', best '+Math.max(...v)); } console.log('runs '+JSON.stringify(runs)); console.log(JSON.stringify(s)); const low=['performance','accessibility','best-practices','seo'].filter((k)=>!(s[k]>=90)); if (low.length) { console.error('below 90: '+low.join(', ')); process.exit(1); }"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lighthouse-report
          path: frontend/lh
          if-no-files-found: warn
