# GitHub Actions CI for Nyando Flood AI
#
# Why actions/checkout@v5 and setup-python@v6?
#   The previous versions (v4, v5) used Node.js 16 which GitHub deprecated.
#   The deprecation warnings were showing up in CI logs and obscuring the
#   real import errors. Updated to current LTS versions.
#
# Why the schema validation step before pytest?
#   If nyando_training_v1.csv is missing or malformed, pytest collection
#   would crash with exit code 2 (collection failure), not a test failure.
#   The schema gate gives a clear error message instead.

name: AI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check model and data artifacts exist
        run: |
          ls models/*.pkl 2>/dev/null  && echo "model pkl         OK" || echo "model pkl         MISSING"
          ls data/training/*.csv 2>/dev/null && echo "training CSVs     OK" || echo "training CSVs     MISSING"

      - name: Validate canonical real-GEE training schema
        run: python src/data/validate_training_data.py

      - name: Run tests
        run: pytest tests/ -v --tb=short
