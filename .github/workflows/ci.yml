name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # The constraints file pins every package the install can pull in. A connection that breaks mid-download can bypass pip's own retries, so the whole install is retried.
          for attempt in 1 2 3; do
            python -m pip install --retries 5 --timeout 60 --upgrade pip && python -m pip install --retries 5 --timeout 60 -r requirements.txt -r requirements-onnx.txt -c constraints-ci.txt && exit 0
            echo "install attempt $attempt failed"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Run tests
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          # Pull requests from forks and from Dependabot get no Actions secrets (GitHub treats Dependabot runs like fork runs). Only those runs may skip the tests that need an Earth Engine session.
          EE_OPTIONAL: ${{ github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ] && [ "$EE_OPTIONAL" = "true" ]; then
            echo "::notice::No Earth Engine credentials in this run (a fork or Dependabot pull request): the tests that need an Earth Engine session are skipped."
          fi
          pytest -v -rs
