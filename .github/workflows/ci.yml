name: CI – Nyando Flood AI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas \
            numpy \
            scikit-learn \
            imbalanced-learn \
            xgboost \
            matplotlib \
            joblib \
            pytest \
            requests

      - name: Verify key assets exist
        run: |
          echo "=== Checking critical files ==="
          test -f metrics.json            && echo "metrics.json       OK" || echo "metrics.json       MISSING"
          test -f pytest.ini              && echo "pytest.ini         OK" || echo "pytest.ini         MISSING"
          test -f conftest.py             && echo "conftest.py        OK" || echo "conftest.py        MISSING"
          test -f tests/test_pipeline.py  && echo "test_pipeline.py   OK" || echo "test_pipeline.py   MISSING"
          ls models/*.pkl 2>/dev/null     && echo "model pkl          OK" || echo "model pkl          MISSING"
          ls data/training/*.csv 2>/dev/null && echo "training CSVs   OK" || echo "training CSVs      MISSING"

      - name: Run tests
        run: pytest tests/ -v --tb=short
