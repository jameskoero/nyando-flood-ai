name: CI — Nyando Flood AI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn imbalanced-learn pandas numpy joblib pytest

      - name: Test 1 — training data exists and is valid
        run: >-
          python -c "
          import pandas as pd;
          df = pd.read_csv('data/training/nyando_training_v1.csv');
          assert len(df) >= 100, f'Too few rows: {len(df)}';
          assert 'flooded' in df.columns;
          assert df['flooded'].isin([0,1]).all();
          print(f'PASS: data {df.shape}, flood_rate={df[\"flooded\"].mean():.1%}')
          "

      - name: Test 2 — metrics.json is valid
        run: >-
          python -c "
          import json;
          m = json.load(open('metrics.json'));
          auc = float(m.get('auc_roc', m.get('auc', 0)));
          f1  = float(m.get('f1_score', m.get('f1', 0)));
          assert auc >= 0.85, f'AUC too low: {auc}';
          assert f1  >= 0.75, f'F1 too low: {f1}';
          print(f'PASS: AUC={auc}, F1={f1}')
          "

      - name: Test 3 — model loads and predicts valid probability
        run: >-
          python -c "
          import joblib, numpy as np;
          m = joblib.load('models/nyando_xgb_v1.pkl');
          s = np.array([[1200.0, 3.0, 60.0, 500.0, 35.0, 40]]);
          p = float(m.predict_proba(s)[0,1]);
          assert 0.0 <= p <= 1.0, f'Bad probability: {p}';
          print(f'PASS: risk_score={p:.4f}')
          "

      - name: Test 4 — model rejects wrong input shape
        run: >-
          python -c "
          import joblib, numpy as np;
          m = joblib.load('models/nyando_xgb_v1.pkl');
          assert hasattr(m, 'predict_proba');
          assert hasattr(m, 'feature_importances_');
          print('PASS: model interface correct')
          "

      - name: Test 5 — run pytest suite
        run: pytest tests/ -v --tb=long
        continue-on-error: true

      - name: Summary
        run: echo "All core checks passed. Repo is healthy."
