name: CI — Nyando Flood AI Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn imbalanced-learn \
                      pandas numpy matplotlib joblib \
                      pytest pytest-cov

      - name: Verify training data
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('data/training/nyando_training_v1.csv')
          assert len(df) >= 100, f'Only {len(df)} rows'
          assert 'flooded' in df.columns, 'Missing target column'
          assert df['flooded'].isin([0,1]).all(), 'Target not binary'
          print(f'Data OK: {df.shape}  flood rate: {df[\"flooded\"].mean():.1%}')
          "

      - name: Verify metrics
        run: |
          python -c "
          import json
          m = json.load(open('metrics.json'))
          assert m['auc_roc'] >= 0.85, f'AUC too low: {m[\"auc_roc\"]}'
          assert m['f1_score'] >= 0.75, f'F1 too low: {m[\"f1_score\"]}'
          print(f'Metrics OK: AUC={m[\"auc_roc\"]}  F1={m[\"f1_score\"]}')
          "

      - name: Verify model loads
        run: |
          python -c "
          import joblib, numpy as np
          model = joblib.load('models/nyando_xgb_v1.pkl')
          sample = np.array([[1200, 3.0, 60.0, 500, 35.0, 40]])
          prob = float(model.predict_proba(sample)[0, 1])
          assert 0 <= prob <= 1
          print(f'Model OK: risk_score={prob:.3f}')
          "

      - name: Run pytest
        run: pytest tests/ -v --tb=short
