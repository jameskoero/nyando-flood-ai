name: data-gate

# Runs on EVERY pull request, not only on data changes. A required status check that is
# skipped by a path filter never reports, and the PR then waits forever. The gate is cheap.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install gate dependencies
        run: |
          # A connection that breaks mid-download can bypass pip's own retries, so the whole install is retried.
          for attempt in 1 2 3; do
            python -m pip install --quiet --retries 5 --timeout 60 -r requirements-gate.txt && exit 0
            echo "install attempt $attempt failed"
            sleep $((attempt * 15))
          done
          exit 1
      - name: A-Gate
        run: python -m pytest tests/test_data_gate.py -q --noconftest -p no:cacheprovider -rx
