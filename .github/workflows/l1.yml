name: L1
# Phase L, step L1 (docs/PHASE_L_PROTOCOL.md): the leakage audit of land_cover and clay_percent, run by hand. It is read-only; the DagsHub token is used only to log one MLflow run.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install the CI set
        run: python -m pip install --retries 5 -r requirements.txt -r requirements-onnx.txt -c constraints-ci.txt
      - name: Run L1
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: python scripts/run_phase_l.py --log-mlflow
